<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Agent Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="side">
    <h1>Agent Console</h1>
    <form id="new-session">
      <label>Agente
        <select id="agent"></select>
      </label>
      <label>Repositório
        <button type="button" id="pick-repo">Escolher pasta…</button>
        <span id="repo-path" class="mono muted">nenhum</span>
      </label>
      <label>Tarefa (cria worktree)
        <input id="task" placeholder="ex.: corrige-login (vazio = usa o repo)" autocomplete="off">
      </label>
      <button type="submit" id="start">Abrir agente</button>
      <p id="form-error" class="error" hidden></p>
    </form>
    <button type="button" id="open-history" class="ghost wide">Histórico do hub (todas as máquinas)</button>
    <h2>Sessões</h2>
    <ul id="sessions"></ul>
    <h2>Fora do app <span id="external-note" class="muted"></span></h2>
    <ul id="external"></ul>
  </aside>
  <main id="main">
    <div id="empty" class="muted">Abra um agente para começar.</div>
    <section id="history" hidden>
      <header class="history-head">
        <div class="row">
          <select id="h-machine"></select>
          <select id="h-tool"></select>
          <select id="h-project"></select>
          <input id="h-text" placeholder="buscar no resumo" autocomplete="off">
          <button type="button" id="h-refresh" class="ghost">Atualizar</button>
        </div>
        <div id="h-note" class="muted"></div>
      </header>
      <div class="history-body">
        <ul id="h-list"></ul>
        <div id="h-detail">
          <p id="h-empty" class="muted">Escolha uma sessão para ver a conversa.</p>
          <div id="h-session" hidden>
            <div id="h-title"></div>
            <div class="row h-continue">continuar aqui em <select id="h-agent"></select>
              na pasta <button type="button" id="h-pick" class="ghost">Escolher pasta…</button>
              <span id="h-cwd" class="mono muted">nenhuma</span>
              <button type="button" id="h-continue">Continuar aqui</button></div>
            <p id="h-error" class="error" hidden></p>
            <div id="h-turns"></div>
          </div>
        </div>
      </div>
    </section>
    <section id="view" hidden>
      <header id="view-head">
        <div><strong id="view-title"></strong> <span id="view-status" class="pill"></span>
          <label id="mode-box" hidden>modo <select id="mode"></select></label>
          <span id="continue-box">continuar em <select id="continue-agent"></select>
            <button type="button" id="continue" class="ghost">Continuar</button></span></div>
        <div id="view-cwd" class="mono muted"></div>
      </header>
      <div id="waiting-bar" hidden></div>
      <details id="plan-box" hidden><summary>Plano do agente</summary><ol id="plan"></ol></details>
      <div id="timeline"></div>
      <form id="prompt-form">
        <textarea id="prompt" rows="3" placeholder="Mensagem para o agente (⌘↩ envia)"></textarea>
        <div class="row">
          <button type="submit" id="send">Enviar</button>
          <button type="button" id="cancel">Cancelar turno</button>
          <button type="button" id="close" class="ghost">Fechar sessão</button>
        </div>
      </form>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
